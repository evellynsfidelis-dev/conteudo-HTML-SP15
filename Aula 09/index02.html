<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 09 - HTML</title>
    </head>
    <body>

        <h1>Definindo marcadores na página HTML</h1>

        <img src="img/sticker-joia.png" alt="Sticker/emoticon de joia" width="250" height="250">

        <hr>

        <h3>Definindo altura e largura de imagens com o CSS</h3>

        <img src="img/sticker-joia.png" alt="Sticker/emoticon de joia" style="width: 250px; height: 250px;">

        <hr>

        <h3>Utilizando imagens dinâmicas no HTML</h3>

        <img src="img/chico-liro.gif" alt="Galinho Chicken Little" width="180px" height="200px">

        <hr>

        <h3>Utilizando imagem flutuante</h3>

        <p>
        <img src="img/chico-liro.gif" style="width: 180px; height: 200px; float: right;">
        Somente a dor coletiva gera união.
        </p>

        

    </body>
